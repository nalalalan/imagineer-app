<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paper | imagineer.aolabs.io</title>
<meta name="description" content="Imagineer paper and PDF.">
  <link rel="canonical" href="https://imagineer.aolabs.io/paper">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="AO Labs">
  <meta property="og:title" content="An autonomous career system for embodied creative research and development">
  <meta property="og:description" content="Continuous research record for the Imagineer system.">
  <meta property="og:url" content="https://imagineer.aolabs.io/paper">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css?v=20260507-paper">
  <style>
    .paper-page {
      width: min(calc(100vw - 36px), var(--max));
      margin: 0 auto;
      padding: 18px 0 34px;
    }

    .paper-frame {
      height: min(78vh, 920px);
      min-height: 620px;
      overflow: hidden;
    }

    .paper-frame iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    @media (max-width: 700px) {
      .paper-frame {
        height: 72vh;
        min-height: 460px;
      }
    }
  </style>
</head>
<body>
  <main class="paper-page">
    <header class="topbar">
      <a href="/" class="brand">
        <img src="/favicon.svg" alt="">
        <span>Imagineer</span>
      </a>
      <div class="actions">
        <a class="button-link secondary" href="/">Status</a>
        <a class="button-link" href="/paper.pdf" download>PDF</a>
        <a class="button-link secondary ao-home" href="https://aolabs.io/" aria-label="AO Labs">
          <img src="https://aolabs.io/favicon.svg?v=20260507-suite3" alt="">
        </a>
      </div>
    </header>

    <section class="panel paper-panel" aria-label="Paper">
      <div>
        <p class="kicker">Paper</p>
        <h2>An autonomous career system for embodied creative research and development</h2>
        <p class="paper-copy">Current PDF. Continuous record.</p>
      </div>
      <div class="paper-actions">
        <a class="button-link" href="/paper.pdf" download>Open PDF</a>
        <a class="button-link secondary" href="/paper/references.bib">References</a>
      </div>
    </section>

    <section class="panel paper-frame" aria-label="PDF preview">
      <iframe src="/paper.pdf#view=FitH" title="Imagineer paper PDF"></iframe>
    </section>
  </main>
</body>
</html>
