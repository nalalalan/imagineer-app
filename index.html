<body>
  <header class="suite-topbar" aria-label="imagineer navigation">
    <div class="suite-brand-cluster">
      <a class="suite-ao-home" href="https://aolabs.io/" aria-label="aolabs.io">
        <img src="https://aolabs.io/marks/ao-ink.svg?v=20260516-suite-bloom" alt="">
      </a>
      <a href="/" class="suite-app-brand" aria-label="imagineer home">

    </div>
    <div class="suite-topbar-actions" aria-label="imagineer actions">
      <a href="./profile.html">profile</a>
      <a href="https://progress.aolabs.io/">progress</a>
    </div>
  </header>

  <header class="paper-strip" aria-label="imagineer paper">
    <div class="paper-copy">
      <span>Paper</span>
      <strong>An autonomous career system for embodied creative research and development</strong>
      <p>WDI R&amp;D profile, current step, and source-bounded state loop.</p>
    </div>
    <div class="paper-actions">
      <a class="button-link paper-button primary" href="/paper.pdf" download>Open PDF</a>
    </div>
  </header>

  <main class="shell step-shell">

    <section class="panel single-step" aria-labelledby="step-title">
      <p class="kicker">Now</p>
      <h1 id="step-title">Loading current step.</h1>
      <p id="step-body" class="step-copy">Reading Progress and Imagineer state.</p>
      <p id="step-why" class="step-why" hidden></p>
      <div class="step-actions">
        <a id="step-link" class="button-link" href="https://docs.google.com/document/d/1Ffi51WavVvaFBUQX37AbFQ4ZKGEkRlGl-NRcOVQP03c/edit">Open doc</a>
        <button id="refresh" type="button">Refresh</button>
      </div>
      <dl class="step-meta" id="step-meta" aria-label="Current basis" hidden>
        <div>
          <dt>Time</dt>
          <dd id="step-time"></dd>
        </div>
        <div>
          <dt>Updated</dt>
          <dd id="step-updated"></dd>
        </div>
        <div>
          <dt>Source</dt>
          <dd id="step-source"></dd>
        </div>
      </dl>
    </section>
  </main>

  <script src="./app.js?v=20260606-fluxcell-linkage"></script>
